version: '3.8'

services:
  # 1. Zookeeper (Required by Kafka to manage cluster state)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pipeline_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 2. Apache Kafka (Message Broker for high-speed streaming)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pipeline_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Configure listeners so Python can connect via localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 3. MinIO (Local AWS S3 Alternative for Data Lake)
  minio:
    image: minio/minio
    container_name: pipeline_minio
    ports:
      - "9000:9000" # API Port (Used by Python boto3)
      - "9001:9001" # Web UI Port (For you to view files)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # Command to start the server and set the Web UI port
    command: server /data --console-address ":9001"

  # 4. PostgreSQL (Serving Layer / Data Warehouse)
  postgres:
    image: postgres:15
    container_name: pipeline_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 20292001
      POSTGRES_DB: stock_analytics